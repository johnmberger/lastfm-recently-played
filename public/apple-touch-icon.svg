<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180" fill="none">
  <defs>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <!-- soft dark badge so it reads on light home screens -->
  <circle cx="90" cy="90" r="90" fill="#0f172a"/>
  <!-- head -->
  <circle cx="90" cy="98" r="52" fill="url(#head)"/>
  <!-- eyes -->
  <circle cx="72" cy="88" r="9" fill="#0f172a"/>
  <circle cx="108" cy="90" r="9" fill="#0f172a"/>
  <circle cx="75" cy="85" r="3.2" fill="#fff"/>
  <circle cx="111" cy="87" r="3.2" fill="#fff"/>
  <!-- smile -->
  <path d="M70 112c8 8 32 8 40 0" stroke="#0f172a" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- headphones -->
  <path d="M48 88c0-30 18-48 42-48s42 18 42 48" stroke="#fff" stroke-width="9" stroke-linecap="round" fill="none"/>
  <rect x="38" y="78" width="18" height="32" rx="8" fill="#fff"/>
  <rect x="124" y="78" width="18" height="32" rx="8" fill="#fff"/>
</svg>
